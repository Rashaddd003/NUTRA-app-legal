<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redeem your NUTRA promo code</title>
<style>
  :root {
    --brand: #4A6359;
    --bg: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #767676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(74,99,89,0.15);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  .code-pill {
    display: inline-block;
    background: rgba(74,99,89,0.08);
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-secondary { background: #fff; color: var(--brand); border: 1px solid rgba(74,99,89,0.25); }
  #manual { display: none; }
  .logo { font-weight: 800; letter-spacing: 1px; color: var(--brand); margin-bottom: 20px; font-size: 15px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NUTRA</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Opening NUTRA…</h1>
    <p id="subtext">Redeeming your promo code automatically.</p>
    <div class="code-pill" id="codePill" style="display:none;"></div>

    <div id="manual">
      <a class="btn btn-primary" id="openAppBtn" href="#">Open in NUTRA</a>
      <a class="btn btn-secondary" id="storeBtn" href="#">Get the NUTRA App</a>
    </div>
  </div>

  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Accept either ?code= or ?promoCode= — matches what
    // components/providers/DeepLinkHandler.tsx already looks for.
    var code = getParam('code') || getParam('promoCode') || '';
    var appLink = 'nutraapp://?code=' + encodeURIComponent(code);

    var IOS_APP_STORE_URL = 'https://apps.apple.com/us/app/nutra-new-norm-of-nutrition/id6763406496';
    var ANDROID_PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.nutraapp.app';

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function isAndroid() {
      return /Android/.test(navigator.userAgent);
    }
    function isMobile() {
      return isIOS() || isAndroid();
    }

    var storeUrl = isIOS() ? IOS_APP_STORE_URL : (isAndroid() ? ANDROID_PLAY_STORE_URL : IOS_APP_STORE_URL);

    document.getElementById('openAppBtn').href = appLink;
    document.getElementById('storeBtn').href = storeUrl;

    if (code) {
      var pill = document.getElementById('codePill');
      pill.textContent = code.toUpperCase();
      pill.style.display = 'inline-block';
    }

    if (!code) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Missing promo code';
      document.getElementById('subtext').textContent = 'This link is missing a code — ask for a new one.';
    } else if (!isMobile()) {
      // A nutraapp:// link and a mobile App/Play Store page are both
      // meaningless on a desktop browser — there's no app to open and
      // nothing to install from a PC. Previously this fell through to the
      // same mobile logic below, which waited 1.8s and then auto-redirected
      // desktop visitors to the App Store anyway (confusing, and not
      // actually actionable there). Just tell them to use their phone
      // instead of bouncing them anywhere.
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Open this link on your phone';
      document.getElementById('subtext').textContent = 'This promo code can only be redeemed in the NUTRA app. Open this link on your iPhone or Android phone to continue.';
    } else {
      // Mobile flow: attempt the app link, then fall back to the store.

      // If the app actually opens, the browser tab gets backgrounded —
      // track that so the store auto-redirect below never fires for
      // someone whose app just opened a little slower than our timeout.
      var appOpened = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) appOpened = true;
      });

      // Try to open the app immediately. Note: iOS Safari frequently blocks
      // a programmatic redirect to a custom scheme that fires without a
      // direct user tap, so this may silently do nothing on some devices —
      // that's exactly why both the manual "Open in NUTRA" button and the
      // store auto-redirect below exist as fallbacks rather than relying on
      // this alone.
      window.location.href = appLink;

      // If we're still on this page after a beat, the app isn't installed
      // (or the automatic app-link redirect was blocked) — stop spinning,
      // reveal the manual buttons, and auto-redirect to the correct store
      // for this device (Play Store on Android, App Store on iOS). The
      // manual buttons stay as a guaranteed fallback in case this redirect
      // is also blocked by the browser.
      setTimeout(function () {
        if (appOpened) return;

        document.getElementById('spinner').style.display = 'none';
        document.getElementById('heading').textContent = 'Continue to NUTRA';
        document.getElementById('subtext').textContent = 'Redirecting you to get the NUTRA app…';
        document.getElementById('manual').style.display = 'block';
        window.location.href = storeUrl;
      }, 1800);
    }
  </script>
</body>
</html>
