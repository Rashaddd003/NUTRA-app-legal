<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redeem your NUTRA promo code</title>
<style>
  :root {
    --brand: #4A6359;
    --bg: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #767676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .code-pill {
    display: inline-block;
    background: rgba(74,99,89,0.08);
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-secondary { background: #fff; color: var(--brand); border: 1px solid rgba(74,99,89,0.25); }
  .logo { font-weight: 800; letter-spacing: 1px; color: var(--brand); margin-bottom: 20px; font-size: 15px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NUTRA</div>
    <h1 id="heading">Redeem your promo code</h1>
    <p id="subtext">Already have NUTRA? Tap "Open in NUTRA" to redeem automatically. Don't have it yet? Download it below, then come back and tap this link again to redeem your code.</p>
    <div class="code-pill" id="codePill" style="display:none;"></div>

    <a class="btn btn-primary" id="openAppBtn" href="#">Open in NUTRA</a>
    <a class="btn btn-secondary" href="https://apps.apple.com/us/app/nutra-new-norm-of-nutrition/id6763406496">Download on the App Store</a>
    <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.nutraapp.app">Get it on Google Play</a>
  </div>

  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Accept either ?code= or ?promoCode= — matches what
    // components/providers/DeepLinkHandler.tsx already looks for.
    var code = getParam('code') || getParam('promoCode') || '';
    var appLink = 'nutraapp://?code=' + encodeURIComponent(code);

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function isAndroid() {
      return /Android/.test(navigator.userAgent);
    }
    function isMobile() {
      return isIOS() || isAndroid();
    }

    document.getElementById('openAppBtn').href = appLink;

    if (code) {
      var pill = document.getElementById('codePill');
      pill.textContent = code.toUpperCase();
      pill.style.display = 'inline-block';
    } else {
      document.getElementById('heading').textContent = 'Missing promo code';
      document.getElementById('subtext').textContent = 'This link is missing a code — ask for a new one.';
    }

    // If NUTRA is already installed, try opening it right away so the code
    // redeems without the user needing to tap anything. This is a single,
    // one-shot attempt with no timer and no automatic redirect afterward —
    // if it doesn't work (app not installed, or an in-app browser like
    // WhatsApp's blocks custom URL schemes), the three buttons above are
    // the actual fallback the visitor sees and controls themselves.
    if (code && isMobile()) {
      window.location.href = appLink;
    }
  </script>
</body>
</html>
