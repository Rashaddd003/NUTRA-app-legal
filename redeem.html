<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redeem your NUTRA promo code</title>
<style>
  :root {
    --brand: #4A6359;
    --bg: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #767676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(74,99,89,0.15);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  .code-pill {
    display: inline-block;
    background: rgba(74,99,89,0.08);
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-secondary { background: #fff; color: var(--brand); border: 1px solid rgba(74,99,89,0.25); }
  #manual { display: none; }
  .logo { font-weight: 800; letter-spacing: 1px; color: var(--brand); margin-bottom: 20px; font-size: 15px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NUTRA</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Opening NUTRA…</h1>
    <p id="subtext">Redeeming your promo code automatically.</p>
    <div class="code-pill" id="codePill" style="display:none;"></div>

    <div id="manual">
      <a class="btn btn-primary" id="openAppBtn" href="#">Open in NUTRA</a>
      <a class="btn btn-secondary" id="storeBtn" href="#">Get the NUTRA App</a>
    </div>
  </div>

  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Accept either ?code= or ?promoCode= — matches what
    // components/providers/DeepLinkHandler.tsx already looks for.
    var code = getParam('code') || getParam('promoCode') || '';
    var appLink = 'nutraapp://?code=' + encodeURIComponent(code);

    var IOS_APP_STORE_URL = 'https://apps.apple.com/us/app/nutra-new-norm-of-nutrition/id6763406496';
    var ANDROID_PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.nutraapp.app';

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function isAndroid() {
      return /Android/.test(navigator.userAgent);
    }

    var storeUrl = isIOS() ? IOS_APP_STORE_URL : (isAndroid() ? ANDROID_PLAY_STORE_URL : IOS_APP_STORE_URL);

    document.getElementById('openAppBtn').href = appLink;
    document.getElementById('storeBtn').href = storeUrl;

    if (code) {
      var pill = document.getElementById('codePill');
      pill.textContent = code.toUpperCase();
      pill.style.display = 'inline-block';
    } else {
      document.getElementById('heading').textContent = 'Missing promo code';
      document.getElementById('subtext').textContent = 'This link is missing a code — ask for a new one.';
    }

    // Try to open the app immediately. Note: iOS Safari frequently blocks a
    // programmatic redirect to a custom scheme that fires without a direct
    // user tap, so this may silently do nothing on some devices — that's
    // exactly why the manual "Open in NUTRA" button below exists as a
    // guaranteed fallback rather than relying on this alone.
    if (code) {
      window.location.href = appLink;
    }

    // If we're still on this page after a beat, either the app isn't
    // installed or the automatic redirect was blocked — stop spinning and
    // show the manual buttons instead of hanging forever.
    setTimeout(function () {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = code ? 'Continue to NUTRA' : 'Missing promo code';
      document.getElementById('subtext').textContent = code
        ? 'Tap below to open the app and redeem your code.'
        : 'This link is missing a code — ask for a new one.';
      document.getElementById('manual').style.display = 'block';
    }, 1800);
  </script>
</body>
</html>
