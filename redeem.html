<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redeem your NUTRA promo code</title>
<style>
  :root {
    --brand: #4A6359;
    --bg: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #767676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .code-pill {
    display: inline-block;
    background: rgba(74,99,89,0.08);
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn svg { flex-shrink: 0; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-secondary { background: #fff; color: var(--brand); border: 1px solid rgba(74,99,89,0.25); }
  .logo { font-weight: 800; letter-spacing: 1px; color: var(--brand); margin-bottom: 20px; font-size: 15px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NUTRA</div>
    <h1 id="heading">Redeem your promo code</h1>
    <p id="subtext">Already have NUTRA? Tap "Open in NUTRA" to redeem automatically. Don't have it yet? Download it below, then come back and tap this link again to redeem your code.</p>
    <div class="code-pill" id="codePill" style="display:none;"></div>

    <a class="btn btn-primary" id="openAppBtn" href="#">Open in NUTRA</a>
    <a class="btn btn-secondary" href="https://apps.apple.com/us/app/nutra-new-norm-of-nutrition/id6763406496">
      <svg width="18" height="18" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      Download on the App Store
    </a>
    <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.nutraapp.app">
      <svg width="18" height="18" viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
      Get it on Google Play
    </a>
  </div>

  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Accept either ?code= or ?promoCode= — matches what
    // components/providers/DeepLinkHandler.tsx already looks for.
    var code = getParam('code') || getParam('promoCode') || '';
    var appLink = 'nutraapp://?code=' + encodeURIComponent(code);

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function isAndroid() {
      return /Android/.test(navigator.userAgent);
    }
    function isMobile() {
      return isIOS() || isAndroid();
    }

    document.getElementById('openAppBtn').href = appLink;

    if (code) {
      var pill = document.getElementById('codePill');
      pill.textContent = code.toUpperCase();
      pill.style.display = 'inline-block';
    } else {
      document.getElementById('heading').textContent = 'Missing promo code';
      document.getElementById('subtext').textContent = 'This link is missing a code — ask for a new one.';
    }

    // If NUTRA is already installed, try opening it right away so the code
    // redeems without the user needing to tap anything. This is a single,
    // one-shot attempt with no timer and no automatic redirect afterward —
    // if it doesn't work (app not installed, or an in-app browser like
    // WhatsApp's blocks custom URL schemes), the three buttons above are
    // the actual fallback the visitor sees and controls themselves.
    if (code && isMobile()) {
      window.location.href = appLink;
    }
  </script>
</body>
</html>
